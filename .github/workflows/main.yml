name: Build Google GKI 5.10

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-22.04

    steps:

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git repo python3 curl \
            bc bison flex build-essential \
            libssl-dev libelf-dev \
            rsync cpio unzip zip pahole

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          docker system prune -af || true
          df -h

      - name: Init Google GKI
        run: |
          mkdir kernel
          cd kernel
          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b common-android12-5.10-2026-07

      - name: Repo Sync
        run: |
          cd kernel
          repo sync -c -j4

      - name: Increase swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h


      # ==========================
      # KernelSU Next
      # ==========================

      - name: Integrate KernelSU Next
        run: |
          cd kernel
          curl -LSs \
          https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
          | bash -s stable


      # ==========================
      # SUSFS
      # ==========================

      - name: Clone SUSFS
        run: |
          cd kernel

          git clone --depth=1 \
          -b gki-android12-5.10 \
          https://gitlab.com/simonpunk/susfs4ksu \
          susfs


      - name: Apply SUSFS
        run: |
          cd kernel/common

          SUSFS_PATCHES=../susfs/kernel_patches

          cp -R "$SUSFS_PATCHES"/fs/* ./fs
          cp -R "$SUSFS_PATCHES"/include/* ./include


          patch -p1 \
          < "$SUSFS_PATCHES"/50_add_susfs_in_gki-android12-5.10.patch


          patch -p1 \
          < "$SUSFS_PATCHES"/KernelSU/10_enable_susfs_for_ksu.patch



      # ==========================
      # Branding
      # ==========================

      - name: Brand Infinity X Kernel
        run: |
          cd kernel/common

          sed -i \
          's/^SUBLEVEL = .*/SUBLEVEL = 260/' Makefile

          echo "-InfinityX" > localversion


      # ==========================
      # Build
      # ==========================

      - name: Build GKI Kernel
        run: |
          cd kernel

          BUILD_CONFIG=common/build.config.gki.aarch64 \
          build/build.sh -j2


      # ==========================
      # Output
      # ==========================

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: gki-5.10-image
          path: kernel/out/**/Image
