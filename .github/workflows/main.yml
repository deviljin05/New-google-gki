name: Build Google GKI 5.10

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git repo python3 curl

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Init Google GKI
        run: |
          mkdir kernel
          cd kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10-2026-07

      - name: Repo Sync
        run: |
          cd kernel
          repo sync -c -j4
