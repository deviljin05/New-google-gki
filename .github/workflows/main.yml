name: Build Google GKI 5.10

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git repo python3 curl

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Init Google GKI
        run: |
          mkdir kernel
          cd kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10-2026-07

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          docker system prune -af || true
          df -h

      - name: Repo Sync
        run: |
          cd kernel
          repo sync -c -j4

      - name: Check build config
        run: |
          cd kernel
          find common -name "build.config*" | sort

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex build-essential \
            libssl-dev libelf-dev \
            python3 rsync cpio unzip \
            zip pahole

      - name: Show disk usage
        run: |
          df -h
          free -h

      - name: Increase swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Integrate KernelSU Next
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s stable

      - name: Find KernelSU
        run: |
           cd kernel
           find . -type d -iname "*KernelSU*"

      - name: Show tree
        run: |
           pwd
           ls
           ls kernel

      - name: Check kernel files
        run: |
          cd kernel
          ls kernel

      - name: Download and Apply BBRv3 Backport Patch
        run: |
          # 1. Navigate to the core kernel directory containing the network stack
          # (Adjust 'common' to your specific source tree root directory name if different)
          cd common
          
          # 2. Download a community-verified, conflict-resolved BBR/BBRv3 network stack patch for Linux 5.10
          curl -Lo bbr_5.10.patch https://githubusercontent.com
          
          # 3. Apply the patch using the standard patch tool. 
          # This bypasses Git's interactive conflict prompt, safely applying changes to tcp_input.c, tcp.h, etc.
          patch -p1 < bbr_5.10.patch
          
          # 4. Remove the temporary patch file so it doesn't leave uncommitted clutter in the build root
          rm bbr_5.10.patch

      - name: Inject BBR Configurations into GKI Defconfig
        run: |
          # Define the target path to the standard GKI arm64 defconfig file
          DEFCONFIG_PATH="common/arch/arm64/configs/gki_defconfig"
          
          # Append the configuration parameters to compile and enable BBR by default
          echo "CONFIG_TCP_CONG_BBR=y" >> $DEFCONFIG_PATH
          echo "CONFIG_DEFAULT_BBR=y" >> $DEFCONFIG_PATH
          
          # Crucial dependency: BBR relies on the Fair Queue (FQ) packet scheduler to manage pacing
          echo "CONFIG_NET_SCH_FQ=y" >> $DEFCONFIG_PATH
          
          # Verify in the runner logs that the lines were successfully added
          tail -n 5 $DEFCONFIG_PATH
          
      - name: Brand Infinity X Kernel
        run: |
          cd kernel/common

          # Version bump
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 260/' Makefile

          # Local version
          echo "-InfinityX" > localversion

          echo "Kernel branding completed"
          grep SUBLEVEL Makefile
          cat localversion

      - name: Build GKI Kernel
        run: |
          cd kernel
          BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh -j2

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: gki-5.10-image
          path: kernel/out/**/Image
