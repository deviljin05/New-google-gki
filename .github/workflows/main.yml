name: Build Google GKI 5.10

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git repo python3 curl

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Init Google GKI
        run: |
          mkdir kernel
          cd kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10-2026-07

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          docker system prune -af || true
          df -h

      - name: Repo Sync
        run: |
          cd kernel
          repo sync -c -j4

      - name: Check build config
        run: |
          cd kernel
          find common -name "build.config*" | sort

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex build-essential \
            libssl-dev libelf-dev \
            python3 rsync cpio unzip \
            zip pahole

      - name: Show disk usage
        run: |
          df -h
          free -h

      - name: Increase swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Integrate KernelSU Next
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s stable

      - name: Find KernelSU
        run: |
           cd kernel
           find . -type d -iname "*KernelSU*"

      - name: Show tree
        run: |
           pwd
           ls
           ls kernel

      - name: Check kernel files
        run: |
          cd kernel
          ls kernel

      - name: Brand Infinity X Kernel
        run: |
          cd kernel/common

          # Version bump
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 260/' Makefile

          # Local version
          echo "-InfinityX" > localversion

          echo "Kernel branding completed"
          grep SUBLEVEL Makefile
          cat localversion

      - name: Build GKI Kernel
        run: |
          cd kernel
          BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh -j2

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: gki-5.10-image
          path: kernel/out/**/Image
