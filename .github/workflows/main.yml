name: Build Google GKI 5.10

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git repo python3 curl

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Init Google GKI
        run: |
          mkdir kernel
          cd kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10-2026-07

      - name: Repo Sync
        run: |
          cd kernel
          repo sync -c -j4

      - name: Check build config
        run: |
          cd kernel
          find common -name "build.config*" | sort

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex build-essential \
            libssl-dev libelf-dev \
            python3 rsync cpio unzip \
            zip pahole

      - name: Increase swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Integrate KernelSU Next
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s stable

      - name: Check SUSFS structure
        run: |
          git clone --depth=1 https://github.com/WildKernels/GKI_KernelSU_SUSFS.git susfs
          cd susfs
          ls -la
          find . -maxdepth 2 -type f | sort | head -100

      - name: Build GKI Kernel
        run: |
          cd kernel
          BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh -j2

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: gki-5.10-image
          path: kernel/out/**/Image
