name: Build Google GKI 5.10

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git repo python3 curl

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Init Google GKI
        run: |
          mkdir kernel
          cd kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10-2026-07

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          docker system prune -af || true
          df -h

      - name: Repo Sync
        run: |
          cd kernel
          repo sync -c -j4

      - name: Check build config
        run: |
          cd kernel
          find common -name "build.config*" | sort

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex build-essential \
            libssl-dev libelf-dev \
            python3 rsync cpio unzip \
            zip pahole

      - name: Show disk usage
        run: |
          df -h
          free -h

      - name: Increase swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Integrate KernelSU Next
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s stable

      - name: Integrate KernelSU Next
        run: |
          # 1. Run inside Google's 'common' tree folder
          cd kernel_workspace/common
          curl -LSs "https://githubusercontent.com" | bash -

      - name: Fetch and Prepare SUSFS for Android 12 (5.10)
        run: |
          cd kernel_workspace
          git clone https://gitlab.com
          cd susfs4ksu
          # Checkout exact branch for GKI Android 12 - Kernel 5.10
          git checkout gki-android12-5.10

      - name: Copy SUSFS Engine to Google Source Tree
        run: |
          cd kernel_workspace
          # Verified precise paths inside Simonpunk's repo tree
          cp -r susfs4ksu/kernel/fs/susfs common/fs/
          cp susfs4ksu/kernel/include/linux/susfs.h common/include/linux/

      - name: Apply SUSFS Patches to KernelSU Next & 5.10 GKI Core
        run: |
          cd kernel_workspace/common
          
          # 1. Patch KernelSU Next to support SUSFS hooks
          if [ -f ../susfs4ksu/KernelSU/ksu_susfs.patch ]; then
            patch -p1 < ../susfs4ksu/KernelSU/ksu_susfs.patch
          else
            echo "KSU patch skipping or handled via alternative hook file."
          fi
          
          # 2. Patch Google's 5.10 core Virtual File System (VFS)
          # Corrected path to lowercase 'kernel_patches' as hosted on GitLab
          if [ -f ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch ]; then
            patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch
          else
            patch -p1 < ../susfs4ksu/kernel_patches/fs_susfs.patch || echo "Core VFS patch failed"
          fi

      - name: Configure Google GKI Defconfig for 5.10
        run: |
          cd kernel_workspace/common
          TARGET_CONFIG="arch/arm64/configs/gki_defconfig"
          
          # Inject the necessary kernel configuration switches 
          echo "CONFIG_KSU=y" >> $TARGET_CONFIG
          echo "CONFIG_KSU_NEXT=y" >> $TARGET_CONFIG
          echo "CONFIG_SUSFS=y" >> $TARGET_CONFIG
          echo "CONFIG_SUSFS_SMART_HIDE=y" >> $TARGET_CONFIG
      - name: Find KernelSU
        run: |
           cd kernel
           find . -type d -iname "*KernelSU*"

      - name: Show tree
        run: |
           pwd
           ls
           ls kernel

      - name: Check kernel files
        run: |
          cd kernel
          ls kernel

      - name: Brand Infinity X Kernel
        run: |
          cd kernel/common

          # Version bump
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 260/' Makefile

          # Local version
          echo "-InfinityX" > localversion

          echo "Kernel branding completed"
          grep SUBLEVEL Makefile
          cat localversion

      - name: Build GKI Kernel
        run: |
          cd kernel
          BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh -j2

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: gki-5.10-image
          path: kernel/out/**/Image
